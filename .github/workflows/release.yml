name: Build and Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v0.2.1
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      version:
        description: "Version number (e.g., 0.2.1)"
        required: true
        type: string

env:
  APP_NAME: macSCP
  SCHEME: macSCP
  PROJECT: macSCP.xcodeproj

jobs:
  build:
    name: Build and Create DMG
    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }}

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build_number }} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Export App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

      - name: Verify embedded share extension
        run: |
          set -euo pipefail
          APP="build/${{ env.APP_NAME }}.app"
          EXT="$APP/Contents/PlugIns/MacSCPShareExtension.appex"
          test -d "$EXT"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "$EXT/Contents/Info.plist"
          codesign --verify --strict "$APP"
          codesign --verify --strict "$EXT"
          APP_ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>&1 || true)"
          EXT_ENTITLEMENTS="$(codesign -d --entitlements :- "$EXT" 2>&1 || true)"
          printf '%s\n' "$APP_ENTITLEMENTS" | grep -q 'com.apple.security.application-groups'
          printf '%s\n' "$EXT_ENTITLEMENTS" | grep -q 'com.apple.security.application-groups'
          /usr/libexec/PlistBuddy -c 'Print ShareAppGroupIdentifier' "$APP/Contents/Info.plist"

      - name: Create DMG
        run: |
          DMG_NAME="${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg"

          # Create staging directory
          mkdir -p dmg-staging
          cp -R "build/${{ env.APP_NAME }}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications

          # Create DMG
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT
          echo "Created: $DMG_NAME"
          ls -lh "$DMG_NAME"
        id: dmg

      - name: Find Sparkle sign_update tool
        id: sparkle
        run: |
          SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData -path "*/artifacts/sparkle/Sparkle/bin/sign_update" 2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            # Fallback: check SPM build directory
            SIGN_UPDATE=$(find . -path "*/.build/artifacts/sparkle/Sparkle/bin/sign_update" 2>/dev/null | head -1)
          fi
          if [ -z "$SIGN_UPDATE" ]; then
            echo "ERROR: sign_update not found"
            exit 1
          fi
          echo "sign_update=$SIGN_UPDATE" >> $GITHUB_OUTPUT
          echo "Found sign_update at: $SIGN_UPDATE"

      - name: Sign DMG with EdDSA
        id: sign
        run: |
          DMG_NAME="${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg"
          SIGN_UPDATE="${{ steps.sparkle.outputs.sign_update }}"

          # Sign using private key from secret
          SIGNATURE_OUTPUT=$(echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" | "$SIGN_UPDATE" "$DMG_NAME" --ed-key-file -)
          echo "Signature output: $SIGNATURE_OUTPUT"

          # Extract edSignature value
          ED_SIGNATURE=$(echo "$SIGNATURE_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          DMG_LENGTH=$(stat -f%z "$DMG_NAME")

          echo "ed_signature=$ED_SIGNATURE" >> $GITHUB_OUTPUT
          echo "dmg_length=$DMG_LENGTH" >> $GITHUB_OUTPUT
          echo "EdDSA signature: $ED_SIGNATURE"
          echo "DMG length: $DMG_LENGTH"

      - name: Update appcast.xml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import sys, datetime

          version = '${{ steps.version.outputs.version }}'
          build_number = '${{ steps.version.outputs.build_number }}'
          ed_signature = '${{ steps.sign.outputs.ed_signature }}'
          dmg_length = '${{ steps.sign.outputs.dmg_length }}'
          app_name = '${{ env.APP_NAME }}'
          pub_date = datetime.datetime.now(datetime.timezone.utc).strftime('%a, %d %b %Y %H:%M:%S %z')
          dmg_url = f'https://github.com/macnev2013/macSCP/releases/download/v{version}/{app_name}-{version}.dmg'

          new_item = f'''        <item>
                  <title>Version {version}</title>
                  <pubDate>{pub_date}</pubDate>
                  <sparkle:version>{build_number}</sparkle:version>
                  <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                  <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                  <description><![CDATA[
                      <ul>
                          <li>See release notes on GitHub</li>
                      </ul>
                  ]]></description>
                  <enclosure
                      url=\"{dmg_url}\"
                      type=\"application/octet-stream\"
                      sparkle:edSignature=\"{ed_signature}\"
                      length=\"{dmg_length}\"
                  />
              </item>'''

          with open('appcast.xml', 'r') as f:
              content = f.read()

          marker = '<language>en</language>'
          content = content.replace(marker, marker + '\n' + new_item, 1)

          with open('appcast.xml', 'w') as f:
              f.write(content)

          print(f'Updated appcast.xml with version {version}')
          "

      - name: Commit and push appcast.xml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add appcast.xml
          git commit -m "Update appcast.xml for v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
          draft: false
          generate_release_notes: true
          name: ${{ env.APP_NAME }} v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
